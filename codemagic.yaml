# Configuración de Integración Continua (CI/CD) para AgroVision en Codemagic
# Este archivo automatiza la compilación nativa tanto para Android como para iOS.

workflows:
  ios-workflow:
    name: AgroVision iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - apple_credentials # Grupo de variables de entorno de Apple en Codemagic
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          target_type: primary

    scripts:
      - name: Inicializar llavero de firmas iOS
        script: |
          keychain initialize
      - name: Obtener certificados de aprovisionamiento de Apple
        script: |
          # Este paso descarga los perfiles de aprovisionamiento (Provisioning Profiles)
          # y certificados cargados en Codemagic para firmar con TestFlight.
          app-store-connect fetch-signing-files "com.agrovision.app" --project-id "$APP_STORE_CONNECT_PROJECT_ID" --install-profiles
      - name: Instalar dependencias de Flutter
        script: |
          flutter pub get
      - name: Construir y actualizar Pods de iOS
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Compilar archivo IPA para distribución en TestFlight
        script: |
          flutter build ipa --release \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - marce@example.com # Reemplazar con el correo real de Marce
          - estanislao@example.com # Correo de Estanislao
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true # Sube el IPA directo a TestFlight de Apple

  android-workflow:
    name: AgroVision Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          target_type: primary

    scripts:
      - name: Instalar dependencias de Flutter
        script: |
          flutter pub get
      - name: Compilar APK con optimización split-per-abi
        script: |
          flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - marce@example.com
          - estanislao@example.com
        notify:
          success: true
          failure: true
