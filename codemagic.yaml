# Configuración de Integración Continua (CI/CD) para AgroVision en Codemagic
# Este archivo automatiza la compilación nativa tanto para Android como para iOS.

workflows:
  ios-workflow:
    name: AgroVision iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - apple_credentials # Grupo de variables de entorno de Apple en Codemagic
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Inicializar llavero de firmas iOS
        script: |
          keychain initialize
      - name: Instalar dependencias de Flutter
        script: |
          flutter pub get
      - name: Construir y actualizar Pods de iOS
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Compilar archivo iOS para distribución (no-codesign)
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app

    publishing:
      email:
        recipients:
          - marcegon13@gmail.com
          - tano.ballan@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: AgroVision Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Instalar dependencias de Flutter
        script: |
          flutter pub get
      - name: Compilar APK con optimización split-per-abi
        script: |
          flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - marcegon13@gmail.com
          - tano.ballan@gmail.com
        notify:
          success: true
          failure: true
